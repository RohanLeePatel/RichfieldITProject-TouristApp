services:
  postgres:
    image: postgres:16-alpine
    container_name: famplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-famplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-famplanner}
      POSTGRES_DB: ${POSTGRES_DB:-famplanner}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432" # local dev convenience only (e.g. a GUI client) — drop before production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [famplanner-net]

  backend:
    build:
      context: ./backend
    container_name: famplanner-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 4000
      AI_SERVICE_URL: http://ai-services:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks: [famplanner-net]

  ai-services:
    build:
      context: ./ai-services
    container_name: famplanner-ai-services
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
    # Deliberately no "ports:" here — reachable by name (http://ai-services:8000)
    # from other containers on famplanner-net, never from outside it. See docs/docker-guide.html.
    expose:
      - "8000"
    volumes:
      - ./ai-services:/app
    networks: [famplanner-net]

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: famplanner-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [famplanner-net]

networks:
  famplanner-net:
    driver: bridge

volumes:
  pgdata:
