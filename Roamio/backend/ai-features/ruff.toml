# Lint rules for this service (NFR-25). Deliberately a small set: real errors
# (E), unused or undefined names (F) and import order (I). Style rewrites like
# Optional[x] -> x | None are left out so linting flags mistakes, not taste.
line-length = 120
exclude = [".venv", "__pycache__"]

[lint]
select = ["E", "F", "I"]
# No formatter has been adopted, so line length is not enforced; everything
# else in E is. Turn this back on if the team ever runs `ruff format`.
ignore = ["E501"]

[lint.per-file-ignores]
"main.py" = ["E402"]  # load_dotenv() must run before the routers are imported
