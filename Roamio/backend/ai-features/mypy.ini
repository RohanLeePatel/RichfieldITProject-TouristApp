# Type checks for the parts that hold the rules (scoring, data shapes, config).
# Run: mypy   (CI does). Provider modules are left out on purpose: they are
# mostly untyped JSON from outside; add them one at a time as they are tidied.
[mypy]
files = engine, schemas, config, http_client.py, errors.py
explicit_package_bases = True
ignore_missing_imports = True
warn_unused_ignores = True
check_untyped_defs = True
