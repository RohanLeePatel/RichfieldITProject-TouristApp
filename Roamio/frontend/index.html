<!doctype html>
<!-- en-ZA, not en: the app prices in ZAR and the wizard's date inputs were
     rendering mm/dd/yyyy because a bare "en" leaves the browser to guess. -->
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Roamio - plan a trip everyone in the group agrees on</title>
    <meta
      name="description"
      content="Roamio ranks destinations against what your whole group wants - budget, interests, pace and accessibility - and explains why each one matched."
    />
    <meta name="theme-color" content="#0f766e" />

    <!-- Shared links showed a bare URL with no title or summary. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roamio" />
    <meta property="og:url" content="https://roamiio.live/" />
    <meta property="og:title" content="Roamio - plan a trip everyone in the group agrees on" />
    <meta
      property="og:description"
      content="Roamio ranks destinations against what your whole group wants - budget, interests, pace and accessibility - and explains why each one matched."
    />
    <meta property="og:image" content="https://roamiio.live/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
