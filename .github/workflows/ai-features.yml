# Lint, type-check and test the Expert & Integration Service on every push and pull request
# that touches it (NFR-25). No secrets are needed: the tests stub every provider.
name: ai-features

on:
  push:
    paths:
      - "Roamio/backend/travel-intelligence/**"
      - ".github/workflows/ai-features.yml"
  pull_request:
    paths:
      - "Roamio/backend/travel-intelligence/**"
      - ".github/workflows/ai-features.yml"

defaults:
  run:
    working-directory: Roamio/backend/travel-intelligence

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Roamio/backend/travel-intelligence/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        # which files count is in .coveragerc: the whole app, so a new folder
        # cannot go unmeasured by being left off a list
        run: |
          coverage run -m pytest -q
          coverage report -m --fail-under=90
