# Lint and test the Expert & Integration Service on every push and pull request
# that touches it (NFR-25). No secrets are needed: the tests stub every provider.
name: ai-features

on:
  push:
    paths:
      - "Roamio/backend/ai-features/**"
      - ".github/workflows/ai-features.yml"
  pull_request:
    paths:
      - "Roamio/backend/ai-features/**"
      - ".github/workflows/ai-features.yml"

defaults:
  run:
    working-directory: Roamio/backend/ai-features

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Roamio/backend/ai-features/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test with coverage
        run: |
          coverage run --source=cache_utils,config,engine,landmarks,main,ocr,rate_limit,routers,schemas,translation,weather -m pytest -q
          coverage report -m --fail-under=90
