# Dependency advisories include build/development tools and every package root.
name: audit

on:
  pull_request:
    paths:
      - "Roamio/backend/project-backend/package*.json"
      - "Roamio/backend/package*.json"
      - "Roamio/frontend/package*.json"
      - "Roamio/backend/travel-intelligence/requirements*.txt"
      - "Roamio/backend/travel-intelligence/requirements.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 5 * * 1" # Mondays, 07:00 SAST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [Roamio/backend, Roamio/backend/project-backend, Roamio/frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=moderate --ignore-scripts

  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: pip-audit
        working-directory: Roamio/backend/travel-intelligence
        run: |
          pip install pip-audit==2.10.1 -r requirements.lock -r requirements-dev.txt
          pip-audit
