name: security

on:
  push:
  pull_request:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every fetched ref and current files
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all --full-history -m --no-textconv --no-ext-diff" --redact=100 --ignore-gitleaks-allow --max-archive-depth=3 --no-banner
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --ignore-gitleaks-allow --max-archive-depth=3 --no-banner

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/roamio_test
      DIRECT_URL: postgresql://synthetic:synthetic@127.0.0.1:1/roamio_test
      AI_FEATURES_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install Core API without lifecycle scripts
        working-directory: Roamio/backend/project-backend
        run: npm ci --ignore-scripts
      - name: Generate local Prisma client and run synthetic checks
        working-directory: Roamio/backend/project-backend
        run: |
          npx --no-install prisma generate
          npm run selfcheck
      - name: Install frontend without lifecycle scripts
        working-directory: Roamio/frontend
        run: npm ci --ignore-scripts
      - name: Frontend checks
        working-directory: Roamio/frontend
        run: |
          find src -name '*.selfcheck.mjs' -print0 | xargs -0 -n 1 node
          npm run lint
          npm run build
